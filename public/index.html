<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UrbanWear - Luxury Fashion</title>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Toast Notifications -->
    <div id="toast-container"></div>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo" onclick="router.navigate('/')">URBANWEAR</div>

            <div class="nav-links">
                <a onclick="router.navigate('/')" class="active">Home</a>
                <a onclick="router.navigate('/shop')">Shop</a>
                <a onclick="router.navigate('/shop?category=Men')">Men</a>
                <a onclick="router.navigate('/shop?category=Women')">Women</a>
            </div>

            <div class="nav-icons">

                <!-- SEARCH -->
                <button class="nav-icon" onclick="toggleSearch()">
                    <i class="fas fa-search"></i>
                </button>

                <!-- CART -->
                <button class="nav-icon" onclick="router.navigate('/cart')">
                    <i class="fas fa-shopping-bag"></i>
                    <span class="badge" id="cart-badge">0</span>
                </button>

                <!-- USER -->
                <button class="nav-icon" onclick="handleUserIcon()">
                    <i class="fas fa-user"></i>
                </button>

                <!-- 🌙 DARK MODE TOGGLE -->
                <button class="nav-icon" onclick="toggleDarkMode()">
                    <i class="fas fa-moon"></i>
                </button>

                <!-- MOBILE MENU -->
                <button class="hamburger" onclick="toggleMobileMenu()">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
        </div>

        <!-- Search Bar -->
        <div class="search-bar" id="search-bar">
            <input type="text" class="search-input"
                placeholder="Search luxury products..."
                onkeyup="handleSearch(event)">
        </div>
    </nav>

    <!-- Mobile Menu -->
    <div class="mobile-menu" id="mobile-menu">
        <a onclick="router.navigate('/')">Home</a>
        <a onclick="router.navigate('/shop')">Shop</a>
        <a onclick="router.navigate('/cart')">Cart</a>
        <a onclick="handleUserIcon()">Account</a>
    </div>

    <!-- Main App -->
    <main id="app" class="main-content"></main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container footer-grid">
            <div>
                <div class="logo" style="margin-bottom: 20px; color: #fff;">URBANWEAR</div>
                <p style="color: #aaa;">
                    Premium luxury fashion for modern lifestyle.
                </p>
            </div>

            <div>
                <h3>Shop</h3>
                <ul>
                    <li><a onclick="router.navigate('/shop?category=Men')">Men</a></li>
                    <li><a onclick="router.navigate('/shop?category=Women')">Women</a></li>
                </ul>
            </div>

            <div>
                <h3>Help</h3>
                <ul>
                    <li><a href="#">Support</a></li>
                    <li><a href="#">Returns</a></li>
                </ul>
            </div>
        </div>

        <div class="footer-bottom">
            <p>&copy; 2024 UrbanWear</p>
        </div>
    </footer>

    <script src="app.js"></script>

    <!-- 🌙 DARK MODE SCRIPT -->
    <script>
        function toggleDarkMode() {
            document.body.classList.toggle("dark-mode");

            if (document.body.classList.contains("dark-mode")) {
                localStorage.setItem("theme", "dark");
            } else {
                localStorage.setItem("theme", "light");
            }
        }

        // load saved theme
        window.addEventListener("load", () => {
            const theme = localStorage.getItem("theme");
            if (theme === "dark") {
                document.body.classList.add("dark-mode");
            }
        });
    </script>
</body>
</html>
